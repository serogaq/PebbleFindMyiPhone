name: Publish Pebble app

on:
  push:
    tags:
      - "*.*.*-app"

permissions:
  contents: read

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_UUID: 91d0ef11-0f9b-424a-9876-d96b6067e388
  APPSTORE_API_BASE: https://appstore-api.repebble.com

jobs:
  validate-tag:
    name: Validate app release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an x.y.z-app tag from main
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-app$'; then
            printf 'error: tag must have the form x.y.z-app, got %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            printf 'error: tag %s does not point to a commit in main\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          VERSION="${RELEASE_TAG%-app}"
          manifest_version="$(python3 -c 'import json; print(json.load(open("app/package.json"))["version"])')"
          if test "$VERSION" != "$manifest_version"; then
            printf 'error: tag version %s does not match app/package.json version %s\n' \
              "$VERSION" "$manifest_version" >&2
            exit 1
          fi

          python3 .github/scripts/app_release.py validate-changelog --version "$VERSION"

          printf 'value=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

  app-checks:
    name: App tests, ESLint and audit
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/toolchain-versions # zizmor: ignore[self-repository]

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          package-manager-cache: false

      - name: Run app checks
        run: make app-test app-eslint app-audit

  build:
    needs: [validate-tag, app-checks]
    uses: ./.github/workflows/app-build.yml # zizmor: ignore[self-repository]
    with:
      version: ${{ needs.validate-tag.outputs.version }}
      artifact-name: app-release-${{ needs.validate-tag.outputs.version }}

  github-release-draft:
    name: Stage GitHub Release draft
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create or update the GitHub Release.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-release-${{ needs.validate-tag.outputs.version }}
          path: dist

      - name: Validate downloaded release bundle
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: python3 .github/scripts/app_release.py validate-dist --version "$VERSION" dist

      - name: Create or update GitHub Release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          assets=(
            "dist/pebble-find-my-iphone-$VERSION.pbw"
            dist/LICENSE.md
            dist/NOTICE
          )
          github_release_notes="$RUNNER_TEMP/github-release-notes.md"
          {
            cat dist/release-notes.md
            printf '\n---\n\n'
            cat dist/NOTICE
            printf '\n\n%s\n' \
              'Licensed under [PolyForm Noncommercial 1.0.0](https://polyformproject.org/licenses/noncommercial/1.0.0).'
          } > "$github_release_notes"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if test "$is_draft" != true; then
              printf 'error: refusing to modify an already-published GitHub Release\n' >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Find My iPhone $VERSION" \
              --notes-file "$github_release_notes" \
              --draft
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Find My iPhone $VERSION" \
              --notes-file "$github_release_notes" \
              --draft \
              --verify-tag
          fi

  repebble-draft:
    name: Publish RePebble draft
    needs: [validate-tag, build, github-release-draft]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/toolchain-versions # zizmor: ignore[self-repository]

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-release-${{ needs.validate-tag.outputs.version }}
          path: dist

      - name: Validate downloaded release bundle
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: python3 .github/scripts/app_release.py validate-dist --version "$VERSION" dist

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.toolchain.outputs.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ steps.toolchain.outputs.uv-version }}
          enable-cache: false

      - name: Install Pebble toolchain
        env:
          PEBBLE_TOOL_VERSION: ${{ steps.toolchain.outputs.pebble-tool-version }}
          PEBBLE_SDK_VERSION: ${{ steps.toolchain.outputs.pebble-sdk-version }}
          PYTHON_VERSION: ${{ steps.toolchain.outputs.python-version }}
        run: |
          uv tool install --python "$PYTHON_VERSION" "pebble-tool==$PEBBLE_TOOL_VERSION"
          pebble sdk install "$PEBBLE_SDK_VERSION"
          make app-deps

      - name: Patch pebble publish to preserve draft releases
        env:
          PEBBLE_TOOL_VERSION: ${{ steps.toolchain.outputs.pebble-tool-version }}
        run: |
          tool_python="$(uv tool dir)/pebble-tool/bin/python"
          publish_module="$("$tool_python" -c 'import pathlib; import pebble_tool.commands.publish as publish; print(pathlib.Path(publish.__file__).resolve())')"

          published_literal='            "isPublished": "true",'
          visible_literal='            "visible": "true",'
          published_count="$(grep -Fxc "$published_literal" "$publish_module" || true)"
          visible_count="$(grep -Fxc "$visible_literal" "$publish_module" || true)"

          if test "$published_count" -ne 2 || test "$visible_count" -ne 1; then
            printf '%s\n' \
              "error: pebble-tool publish.py no longer matches the expected $PEBBLE_TOOL_VERSION code; refusing to apply the draft-release patch" >&2
            exit 1
          fi

          sed -i \
            -e 's/"isPublished": "true",/"isPublished": "true" if is_published else "false",/g' \
            -e 's/"visible": "true",/"visible": "true" if is_published else "false",/' \
            "$publish_module"

          patched_published='            "isPublished": "true" if is_published else "false",'
          patched_visible='            "visible": "true" if is_published else "false",'
          patched_published_count="$(grep -Fxc "$patched_published" "$publish_module" || true)"
          patched_visible_count="$(grep -Fxc "$patched_visible" "$publish_module" || true)"

          if test "$patched_published_count" -ne 2 || test "$patched_visible_count" -ne 1; then
            printf '%s\n' 'error: failed to verify the pebble-tool draft-release patch' >&2
            exit 1
          fi

          "$tool_python" -m py_compile "$publish_module"

      - name: Exchange Firebase refresh token
        env:
          FIREBASE_API_KEY: ${{ vars.PEBBLE_FIREBASE_API_KEY }}
          FIREBASE_REFRESH_TOKEN: ${{ secrets.PEBBLE_FIREBASE_REFRESH_TOKEN }}
        run: |
          if test -z "$FIREBASE_API_KEY"; then
            printf '%s\n' 'error: repository variable PEBBLE_FIREBASE_API_KEY is not configured' >&2
            exit 1
          fi
          if test -z "$FIREBASE_REFRESH_TOKEN"; then
            printf '%s\n' 'error: secret PEBBLE_FIREBASE_REFRESH_TOKEN is not configured' >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=refresh_token' \
            --data-urlencode "refresh_token=$FIREBASE_REFRESH_TOKEN" \
            --output "$RUNNER_TEMP/firebase-token.json" \
            "https://securetoken.googleapis.com/v1/token?key=$FIREBASE_API_KEY"

          id_token="$(python3 - "$RUNNER_TEMP/firebase-token.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              token = json.load(source).get("id_token")
          if not token:
              raise SystemExit("error: Firebase response did not contain id_token")
          print(token)
          PY
          )"
          printf '::add-mask::%s\n' "$id_token"
          printf 'PEBBLE_FIREBASE_ID_TOKEN=%s\n' "$id_token" >> "$GITHUB_ENV"

      - name: Detect existing RePebble listing
        id: listing
        run: |
          http_status="$(curl --silent --show-error \
            --header "Authorization: Bearer $PEBBLE_FIREBASE_ID_TOKEN" \
            --output "$RUNNER_TEMP/repebble-me.json" \
            --write-out '%{http_code}' \
            "$APPSTORE_API_BASE/api/v1/developer/me")"

          case "$http_status" in
            200)
              exists="$(python3 - "$RUNNER_TEMP/repebble-me.json" "$APP_UUID" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              payload = json.load(source)
          expected = sys.argv[2].lower()
          lookup = (payload.get("app_lookup") or {}).get("by_app_uuid") or {}
          print("true" if any(str(key).lower() == expected for key in lookup) else "false")
          PY
              )"
              ;;
            403)
              code="$(python3 - "$RUNNER_TEMP/repebble-me.json" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as source:
                  print(json.load(source).get("code", ""))
          except (OSError, ValueError):
              print("")
          PY
              )"
              if test "$code" != "DEVELOPER_NOT_LINKED"; then
                printf 'error: RePebble developer lookup failed with HTTP 403 (%s)\n' "$code" >&2
                exit 1
              fi
              exists=false
              ;;
            *)
              printf 'error: RePebble developer lookup failed with HTTP %s\n' "$http_status" >&2
              exit 1
              ;;
          esac

          printf 'exists=%s\n' "$exists" >> "$GITHUB_OUTPUT"

      - name: Publish draft without GIF capture
        shell: bash
        env:
          LISTING_EXISTS: ${{ steps.listing.outputs.exists }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          args=(
            --api-base "$APPSTORE_API_BASE"
            --non-interactive
            --no-gif-all-platforms
            --name "Find My iPhone"
            --version "$VERSION"
            --description "$(cat app/store/description.txt)"
            --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --category tools
            --release-notes "$(cat dist/release-notes.md)"
          )

          if test "$LISTING_EXISTS" != true; then
            shopt -s nullglob
            screenshots=(app/store/screenshots/*.png)
            if test "${#screenshots[@]}" -eq 0; then
              printf '%s\n' 'error: first RePebble draft requires PNG files in app/store/screenshots' >&2
              exit 1
            fi
            for screenshot in "${screenshots[@]}"; do
              filename="${screenshot##*/}"
              case "$filename" in
                diorite_*.png|emery_*.png|flint_*.png|gabbro_*.png) ;;
                *)
                  printf 'error: screenshot name must start with a supported platform: %s\n' "$filename" >&2
                  exit 1
                  ;;
              esac
            done
            screenshot_paths=()
            for screenshot in "${screenshots[@]}"; do
              screenshot_paths+=("$GITHUB_WORKSPACE/$screenshot")
            done
            args+=(--screenshots "${screenshot_paths[@]}")
          fi

          cd app
          pebble publish "${args[@]}"

  finalize-release:
    name: Publish GitHub Release after RePebble succeeds
    if: always()
    needs: [validate-tag, github-release-draft, repebble-draft]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Publishes or rolls back the staged GitHub Release.
    steps:
      - name: Commit or roll back staged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_DRAFT_RESULT: ${{ needs.github-release-draft.result }}
          REPEBBLE_RESULT: ${{ needs.repebble-draft.result }}
        run: |
          if test "$GITHUB_DRAFT_RESULT" = success && test "$REPEBBLE_RESULT" = success; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
            exit 0
          fi

          if test "$GITHUB_DRAFT_RESULT" = success; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          printf 'error: release transaction failed (GitHub draft: %s, RePebble: %s)\n' \
            "$GITHUB_DRAFT_RESULT" "$REPEBBLE_RESULT" >&2
          exit 1
