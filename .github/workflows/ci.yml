name: Pull request CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
      app-version: ${{ steps.filter.outputs.app-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed projects
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          backend=false
          app=false
          if test "$EVENT_NAME" = merge_group || test "$EVENT_NAME" = push; then
            backend=true
            app=true
            printf '%s\n' 'Main and merge queue validation run both project groups.' >> "$GITHUB_STEP_SUMMARY"
          else
            git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
            while IFS= read -r file; do
              case "$file" in
                backend/*)
                  backend=true
                  ;;
                app/*)
                  app=true
                  ;;
                Makefile|toolchain.env|.github/*)
                  backend=true
                  app=true
                  ;;
                LICENSE.md|NOTICE|THIRD_PARTY_NOTICES)
                  backend=true
                  app=true
                  ;;
                CHANGELOG.md)
                  app=true
                  ;;
                .dockerignore)
                  backend=true
                  ;;
              esac
            done < "$RUNNER_TEMP/changed-files"
            {
              printf '### Changed files\n\n```text\n'
              cat "$RUNNER_TEMP/changed-files"
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          app_version="$(python3 -c 'import json; print(json.load(open("app/package.json"))["version"])')"
          {
            printf 'backend=%s\n' "$backend"
            printf 'app=%s\n' "$app"
            printf 'app-version=%s\n' "$app_version"
          } >> "$GITHUB_OUTPUT"

  workflow-audit:
    name: Workflow audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/toolchain-versions # zizmor: ignore[self-repository]

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ steps.toolchain.outputs.uv-version }}
          enable-cache: true

      - name: Run workflow audit
        run: make workflow-audit

  backend:
    name: Backend tests and audit
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/toolchain-versions # zizmor: ignore[self-repository]

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.toolchain.outputs.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ steps.toolchain.outputs.uv-version }}
          enable-cache: true

      - name: Run backend tests
        run: make backend-test

      - name: Run backend audit
        run: make backend-audit

  backend-image-smoke:
    name: Backend image smoke
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-image-build.yml # zizmor: ignore[self-repository]
    with:
      image-name: pebble-find-my-iphone-backend-ci
      tag: pr-${{ github.run_id }}
      platforms: linux/amd64,linux/arm64
      push: false
      runtime-smoke: true

  app:
    name: App tests, ESLint and audit
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/toolchain-versions # zizmor: ignore[self-repository]

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Run app tests
        run: make app-test

      - name: Run ESLint
        run: make app-eslint

      - name: Run dependency audit
        run: make app-audit

  app-release-smoke:
    name: App release smoke build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/app-build.yml # zizmor: ignore[self-repository]
    with:
      version: ${{ needs.changes.outputs.app-version }}
      artifact-name: app-pr-${{ github.run_id }}

  app-artifact-smoke:
    name: App artifact roundtrip
    needs: [changes, app-release-smoke]
    if: needs.changes.outputs.app == 'true' && needs.app-release-smoke.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.app-release-smoke.outputs.artifact-name }}
          path: dist

      - name: Validate downloaded release bundle
        env:
          VERSION: ${{ needs.changes.outputs.app-version }}
        run: python3 .github/scripts/app_release.py validate-dist --version "$VERSION" dist

  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, workflow-audit, backend, backend-image-smoke, app, app-release-smoke, app-artifact-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WORKFLOW_AUDIT_RESULT: ${{ needs.workflow-audit.result }}
          BACKEND_EXPECTED: ${{ needs.changes.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          BACKEND_SMOKE_RESULT: ${{ needs.backend-image-smoke.result }}
          APP_EXPECTED: ${{ needs.changes.outputs.app }}
          APP_RESULT: ${{ needs.app.result }}
          APP_SMOKE_RESULT: ${{ needs.app-release-smoke.result }}
          APP_ARTIFACT_RESULT: ${{ needs.app-artifact-smoke.result }}
        run: |
          set -eu
          failed=false
          check_required() {
            name=$1
            result=$2
            if test "$result" != success; then
              printf 'error: %s finished with %s\n' "$name" "$result" >&2
              failed=true
            fi
          }

          check_required changes "$CHANGES_RESULT"
          check_required workflow-audit "$WORKFLOW_AUDIT_RESULT"
          if test "$BACKEND_EXPECTED" = true; then
            check_required backend "$BACKEND_RESULT"
            check_required backend-image-smoke "$BACKEND_SMOKE_RESULT"
          fi
          if test "$APP_EXPECTED" = true; then
            check_required app "$APP_RESULT"
            check_required app-release-smoke "$APP_SMOKE_RESULT"
            check_required app-artifact-smoke "$APP_ARTIFACT_RESULT"
          fi

          test "$failed" = false
