name: Scheduled security audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-security-audit
  cancel-in-progress: false

jobs:
  workflows:
    name: Workflow audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/toolchain-versions # zizmor: ignore[self-repository]
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.toolchain.outputs.uv-version }}
          enable-cache: false
      - name: Run workflow audit
        run: make workflow-audit

  backend:
    name: Backend tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/toolchain-versions # zizmor: ignore[self-repository]
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.toolchain.outputs.uv-version }}
          enable-cache: false
      - name: Run backend checks
        run: make backend-test backend-audit

  app:
    name: App tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read toolchain versions
        id: toolchain
        uses: ./.github/actions/toolchain-versions # zizmor: ignore[self-repository]
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.toolchain.outputs.node-version }}
          package-manager-cache: false
      - name: Run app checks
        run: make app-test app-eslint app-audit

  backend-image:
    name: Build and scan backend image
    uses: ./.github/workflows/backend-image-build.yml # zizmor: ignore[self-repository]
    with:
      image-name: pebble-find-my-iphone-backend-audit
      tag: weekly-${{ github.run_id }}
      platforms: linux/amd64,linux/arm64
      push: false
      runtime-smoke: true
